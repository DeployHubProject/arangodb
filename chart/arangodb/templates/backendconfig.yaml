{{- if (.Values.ingress).enabled }}
{{- $policy := required "ERROR: .Values.ingress.backendConfig.securityPolicy (Cloud Armor policy name) is required when ingress.enabled=true. Refusing to expose the database without an IP allowlist." (.Values.ingress.backendConfig).securityPolicy }}
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: {{ include "microservice.name" . }}-backendconfig
  labels:
    app: {{ include "microservice.name" . }}
spec:
  securityPolicy:
    name: {{ $policy | quote }}
  timeoutSec: {{ .Values.ingress.backendConfig.timeoutSec | default 300 }}
  healthCheck:
    type: HTTP
    requestPath: {{ .Values.ingress.backendConfig.healthCheckPath | default "/_admin/server/availability" }}
    port: 8529
{{- end }}
