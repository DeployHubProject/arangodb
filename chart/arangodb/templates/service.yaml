apiVersion: v1
kind: Service
metadata:
  name: {{ include "microservice.name" . }}
  labels:
    app: {{ include "microservice.name" . }}
  {{- $ingress := .Values.ingress | default dict }}
  {{- if or $ingress.enabled .Values.service.annotations }}
  annotations:
    {{- if $ingress.enabled }}
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default": "{{ include "microservice.name" . }}-backendconfig"}'
    {{- end }}
    {{- with .Values.service.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  selector:
    app: {{ include "microservice.name" . }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port | default 8529 }}
      targetPort: 8529
      {{- if ((.Values.ingress).nodePort) }}
      nodePort: {{ .Values.ingress.nodePort }}
      {{- end }}
  type: {{ .Values.service.type | default "NodePort" }}
