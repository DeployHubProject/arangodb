{{- if (.Values.ingress).enabled }}
{{- $host := required "ERROR: .Values.ingress.host is required when ingress.enabled=true." .Values.ingress.host }}
{{- $ip := required "ERROR: .Values.ingress.staticIpName is required when ingress.enabled=true." .Values.ingress.staticIpName }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "microservice.name" . }}-ingress
  labels:
    app: {{ include "microservice.name" . }}
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: {{ $ip | quote }}
    networking.gke.io/managed-certificates: {{ .Values.ingress.managedCertName | default "arangodb-managed-cert" | quote }}
    {{- if .Values.ingress.redirectToHttps }}
    networking.gke.io/v1beta1.FrontendConfig: {{ include "microservice.name" . }}-frontend-config
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: "gce"
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "microservice.name" . }}
                port:
                  number: {{ .Values.service.port | default 8529 }}
{{- end }}
